# Study 7 overlay (RUNLOG 2026-10-07, approved): Study 5 momentum (S5a) anchored to the settlement of WTI crude (NYMEX), settlement 14:28-14:30 ET.
# Separate data root; one shared spend ledger. Use per command:
#   $env:GAMMA_EDGE_CONFIG = "config.cl.yaml"   ...   Remove-Item Env:GAMMA_EDGE_CONFIG
extends: config.yaml
name: cl

data:
  root: "data_cl"
  es_symbol: "CL.v.0"
  ledger: "data/spend_ledger.csv"

market:
  tick: 0.01
  point_value: 1000.0
  rth_close: "14:30"            # settlement minute: P_prev is D-1's bar closing here; the time exit is this bar's open
  moc_imbalance_time: "14:20"      # descriptive sub-window only (no MOC in this market)

params:
  s5_decision_time: {value: "14:00", nudges: []}
  s5_exit_time:     {value: "14:30", nudges: []}
  s5_em_unit:       {value: "realized"}
