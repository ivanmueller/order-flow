# Gamma + Order Flow Edge Test -- frozen parameter registry (SPEC.md, "Parameter registry").
# Every tunable number lives here. Do not edit after Stage 1 starts without logging it in RUNLOG.md.
# `nudges` lists the one-notch-up / one-notch-down values used ONLY by the robustness check.

name: main
status:
  frozen: false            # set true (and log in RUNLOG.md) once you've signed off on every value below

# ---------------------------------------------------------------------------
# Sample and holdout
# ---------------------------------------------------------------------------
sample:
  start: "2023-06-01"      # first date with free ThetaData EOD quotes
  # Holdout = most recent 9 months at the time of first pull (first pull: Oct 2026).
  # in_sample(date) excludes every date >= holdout_start. PROPOSED -- confirm before Stage 1.
  holdout_start: "2026-01-01"
  end: "2026-09-30"        # last date ingested (holdout period runs holdout_start .. end)
  # Study 5 sample starts (RUNLOG 2026-10-07): A = data on disk; B needs ES bars 2019-01..2023-03 and a
  # frozen stage-3 day set first. Choice is params.s5_sample. A's start is also B's era boundary.
  s5_starts: {A: "2023-06-02", B: "2019-01-03"}

# ---------------------------------------------------------------------------
# Market conventions (structural, not tuned)
# ---------------------------------------------------------------------------
market:
  tz: "America/New_York"
  tick: 0.25               # ES tick in points
  point_value: 50.0        # $ per point: 50 for ES, 5 for MES
  globex_open: "18:00"     # session D opens 18:00 ET on D-1
  globex_close: "17:00"
  rth_open: "09:30"
  rth_close: "16:00"
  half_day_close: "13:00"
  quote_time: "17:00"      # ThetaData EOD NBBO = Cboe curb-session close on D-1 (start of T_q clock);
                           # was 16:15 per SPEC, changed 2026-10-05 after the pilot quote-time scan (RUNLOG)
  spxw_expiry_time: "16:00"
  spx_expiry_time: "09:30" # AM-settled monthlies settle at the open
  touch_start: "09:31"
  touch_end: "15:50"
  flat_time: "15:55"       # hard time exit for simulated trades
  band_start: "10:00"      # study 3: first band touch counted from here ...
  band_end: "15:00"        # ... to here
  tod_breaks: ["10:30", "14:00"]   # Stage 2 time-of-day buckets: open / midday / close
  minutes_per_year: 525600
  option_multiplier: 100.0 # $ per SPX index point per option contract (study 4)
  moc_imbalance_time: "15:50"   # study 5 descriptive split: NYSE/Nasdaq closing-imbalance publication
  first_half_hour_end: "10:00"  # study 5 descriptive predictor: Gao et al.'s first half-hour ends here

# ---------------------------------------------------------------------------
# Data sources
# ---------------------------------------------------------------------------
data:
  root: "data"
  derived_dir: "derived"   # raw/ is shared by every config; derived tables are per config
  thetadata_url: "http://127.0.0.1:25503/v3"
  thetadata_symbols: ["SPXW", "SPX"]
  thetadata_pause_s: 1.0   # pacing between free-tier requests
  opra_dataset: "OPRA.PILLAR"
  opra_parents: ["SPX.OPT", "SPXW.OPT"]
  es_dataset: "GLBX.MDP3"
  es_symbol: "ES.v.0"
  fred_url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"
  # Stage 3 trade windows: SPEC says t0-10m .. t0+30m, but the confirmed trade can run to
  # t_r + 30m with t_r up to t0 + 10m, so t0+30m would truncate exits. 45m covers it.
  trades_pre_min: 10
  trades_post_min: 45

# ---------------------------------------------------------------------------
# Stage 3 day sample: ES trade data is ~$0.54/day, so Stage 3 runs on a fixed-seed random subset of
# days, stratified by calendar year, chosen before any trade data exists (set 2026-10-06, approved).
# 0 = every day. Stage 2 still uses every day (bars only).
# ---------------------------------------------------------------------------
stage3_sample:
  seed: 20231101
  in_sample_days: 120
  holdout_days: 45

# ---------------------------------------------------------------------------
# Spending guard (CLAUDE.md rule 7)
# ---------------------------------------------------------------------------
budget:
  free_credit_usd: 125.0
  ask_above_single_pull_usd: 5.0
  ask_above_total_usd: 100.0

# ---------------------------------------------------------------------------
# Parameter registry (SPEC.md)
# ---------------------------------------------------------------------------
params:
  max_dte:            {value: 45}
  max_rel_spread:     {value: 0.5,   nudges: [0.3, 0.7]}
  parity_band:        {value: 0.02}
  flip_half_width:    {value: 0.05}          # grid from (1-w) S0 to (1+w) S0
  flip_step:          {value: 5.0}           # SPX points
  gex_pct_lookback:   {value: 252,   nudges: [126, 504]}
  # Sessions of history required before gex_pct is defined. SPEC-literal would be 252 (a full year);
  # set to 126 (six months) on 2026-10-05 so Stage 1 starts ~Dec 2023 instead of ~Jun 2024.
  gex_pct_min_periods: {value: 126}
  round_step:         {value: 50,    nudges: [25, 100]}
  level_window:       {value: 1.0,   nudges: [0.75, 1.25]}   # EM units
  merge_tol:          {value: 2,     nudges: [1, 4]}         # ticks
  approach_a:         {value: 0.10,  nudges: [0.075, 0.15]}  # EM units
  proximity_b:        {value: 2,     nudges: [1, 3]}         # ticks
  approach_lookback:  {value: 30,    nudges: [20, 45]}       # bars
  debounce:           {value: 10,    nudges: [5, 15]}        # bars
  success_R:          {value: 0.10,  nudges: [0.075, 0.15]}  # EM units
  fail_F:             {value: 0.05,  nudges: [0.04, 0.075]}  # EM units (also the naive-baseline stop)
  label_horizon:      {value: 60,    nudges: [45, 90]}       # bars
  mfe_horizon:        {value: 30}                            # bars
  placebo_per_day:    {value: 2}             # was 5 (SPEC); cut 2026-10-06 to shrink Stage 3 trade windows (approved)
  placebo_min_gap:    {value: 4}                             # ticks from any real level
  placebo_seed:       {value: 20230601}
  abs_window:         {value: 3,     nudges: [2, 5]}         # minutes
  abs_threshold:      {value: 2.0,   nudges: [1.5, 3.0]}
  baseline_sessions:  {value: 20,    nudges: [10, 40]}
  reclaim_window:     {value: 10,    nudges: [5, 15]}        # minutes
  reclaim_ticks:      {value: 2,     nudges: [1, 3]}
  break_ticks:        {value: 4,     nudges: [3, 6]}         # V5: penetration through the level that counts as a break
  entry_slippage:     {value: 1,     nudges: [2]}            # ticks
  stop_buffer:        {value: 2,     nudges: [1, 4]}         # ticks
  max_risk:           {value: 0.15,  nudges: [0.10, 0.20]}   # EM units
  min_risk:           {value: 4}                             # ticks
  target_mult:        {value: 1.5,   nudges: [1.0, 2.0]}     # R
  time_exit:          {value: 30,    nudges: [20, 45]}       # minutes
  # All-in round trip per contract (commission + exchange + NFA), the user's broker, set 2026-10-05.
  cost_rt_usd:        {value: 3.98,  nudges: [5.97]}   # nudge = +50%
  # Study 2 (RUNLOG 2026-10-07, approved): tape-footprint confirmation and at-level entries.
  q_big:              {value: 50,    nudges: [25, 100]}    # contracts: a "big lot" print
  s2_delta_min:       {value: 150,   nudges: [100, 250]}   # contracts absorbed at the level (delta_at_level) for S2
  entry_offset:       {value: 1}                           # ticks: E1 limit sits this far inside the level
  fill_window:        {value: 10,    nudges: [5, 15]}      # minutes the E1 limit stays working after t_dec
  retest_window:      {value: 15,    nudges: [10, 20]}     # minutes after a break to wait for the E2 retest
  s2h_target_mult:    {value: 2.5}                         # S2h longer-horizon variant
  s2h_time_exit:      {value: 60}                          # minutes
  # Study 3 (RUNLOG 2026-10-07, approved): session-level gamma regime, expected-move band trades.
  band_a:             {value: 0.50,  nudges: [0.40, 0.60]}  # EM units: band distance from the 09:30 open
  band_stop_s:        {value: 0.25,  nudges: [0.20, 0.35]}  # EM units: stop beyond the band (fade) / back inside (breakout)
  regime_threshold:   {value: 0.5}                          # gex_pct split; pre-registered, no nudge
  perm_draws:         {value: 1000}                         # permutation test draws
  # Study 4 (RUNLOG 2026-10-07, approved): regime-conditioned 0DTE straddle at the D-1 close.
  opt_cost_per_leg_usd: {value: 1.50, nudges: [3.00]}      # all-in per option leg (commission, exchange, regulatory, settlement); confirm with broker
  s4_wing_em:         {value: 1.0,   nudges: [0.75, 1.5]}  # EM units: iron-fly wing distance from the ATM strike
  s4_regime_lag:      {value: 1}                            # sessions: regime = gex_pct of D-1 (point in time at the 17:00 D-1 entry); fixed
  # Study 5 (RUNLOG 2026-10-07, approved with sample A): last-30-minute ES momentum into the close.
  s5_sample:          {value: "A"}                          # sample.s5_starts key; chosen at approval, no nudge
  s5_decision_time:   {value: "15:30", nudges: ["15:25", "15:35"]}  # decision on the bar closing here; entry at this bar's open
  s5_exit_time:       {value: "16:00", nudges: ["15:55", "16:05"]}  # time exit at this bar's open (departs from flat_time on purpose)
  s5_stop_em:         {value: 0.50,  nudges: [0.35, 0.75]}  # S5b stop distance from entry, EM_V units
  s5_em_vix_factor:   {value: 0.75}                         # EM_V = factor x VIX(D-1)/100/sqrt(252) x P_prev; unit convention, no nudge
  s5_perm_block:      {value: 21}                           # sessions per block in gate 5's block shuffle; decides a gate, no nudge
  s5_outlier_n:       {value: 5}                            # report: slope repeated without this many largest |r_ROD|
  s5_sanity_em:       {value: 3.0}                          # report: sessions with |r_L30| above this (EM_V) are listed
  bootstrap_draws:    {value: 5000}
  bootstrap_seed:     {value: 7}
  ci_level:           {value: 0.90}
  nw_lags:            {value: 5}

# ---------------------------------------------------------------------------
# Gate thresholds (SPEC.md, "Scope and stage gates") -- reported against, never tuned
# ---------------------------------------------------------------------------
gates:
  stage1_p: 0.05
  stage1_quintile_gap: 0.15
  stage2_p: 0.10
  stage3_min_trades: 200
  stage3_min_expectancy_r: 0.10
  holdout_min_fraction: 0.5
  study4_min_expectancy_em: 0.03   # study 4: after-cost expectancy per session in expected-move units (about one SPX point)
  study5_min_sessions: 400         # study 5 gates (RUNLOG 2026-10-07)
  study5_min_expectancy_em: 0.02   # after costs, EM_V units
  study5_perm_p: 0.05              # session and block permutation p must both be below this
  study5_tail_drop: 5              # mean without this many best sessions must stay > 0
  robustness_min_positive_share: 0.80
  max_variants_before_nq: 20

# Gate 0 (GEX validation) tolerances
validation:
  forward_tol_pts: 5.0     # check 1: S0 within this many points of (ES at quote_time on D-1 - basis) ...
  forward_share: 0.95      # ... on at least this share of days
