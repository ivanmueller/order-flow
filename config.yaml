  s10b_skip_open_min: {value: 30}                           # H1: no fills in the first this-many minutes after the open
  s10b_min_kept_fills: {value: 500}                         # a hypothesis needs this many kept fills ...
  s10b_min_kept_sessions: {value: 2}                        # ... in at least this many sessions, else not testable
