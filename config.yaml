# ---------------------------------------------------------------------------
# Gate thresholds (SPEC.md, "Scope and stage gates") -- reported against, never tuned
# ---------------------------------------------------------------------------
gates:
  stage1_p: 0.05
  stage1_quintile_gap: 0.15
  stage2_p: 0.10
  stage3_min_trades: 200
  stage3_min_expectancy_r: 0.10
  holdout_min_fraction: 0.5
  study4_min_expectancy_em: 0.03   # study 4: after-cost expectancy per session in expected-move units (about one SPX point)
  study5_min_sessions: 400         # study 5 gates (RUNLOG 2026-10-07)
  study5_min_expectancy_em: 0.02   # after costs, EM_V units
  study5_perm_p: 0.05              # session and block permutation p must both be below this
  study5_tail_drop: 5              # mean without this many best sessions must stay > 0
  study6_min_trades: 300           # study 6 pilot gates (RUNLOG 2026-10-07), per variant
  study6_min_expectancy_pts: 0.25  # after costs, ES points a trade (one tick)
  study6_tail_drop: 5              # after-cost mean without this many best sessions must stay > 0
  study9_advance_fee_usd: 2.79      # study 9 advance rules use the $0-commission round trip (exchange + regulatory fees only)
  study10_min_fills: 1000           # study 10 (RUNLOG 2026-10-08): fills in the spread bucket, present in every session
  study10_advance_horizon_min: 5    # 90% session-bootstrap lower bound of the net mean > 0 at this horizon ...
  study10_confirm_horizon_min: 15   # ... and the net mean > 0 at this one
  study8_min_events: 25            # study 8 (RUNLOG 2026-10-08), per variant: in-sample month-ends
  study8_min_friction_multiple: 3   # after-cost mean must exceed this x friction (2 ticks of slippage + cost)
  study8_tail_drop: 3               # after-cost mean without this many best months must stay > 0
  study12_min_trades: 200          # study 12 (RUNLOG 2026-10-09), Stage 3 rule in SPY: gamma-tagged trades ...
  study12_min_expectancy_r: 0.10    # ... expectancy >= this after costs, 90% day-bootstrap lower bound > 0
  study13_null_p: 0.05              # study 13: the best discovery pattern must beat this share of noise-search bests
  study13_min_obs: 500              # a pattern needs this many decisions ...
  study13_min_days: 15              # ... on this many days (discovery), to be ranked
  study13_max_frozen: 4             # at most this many validated patterns go to the test days (family budget)
  study13_test_min_days: 10         # test: net mean > 0 with a 90% day-bootstrap lower bound > 0 on >= this many days
  study14_min_trades: 100           # study 14: a ranked combination needs this many discovery trades ...
  study14_min_weeks: 20             # ... on this many distinct weeks
  study14_null_p: 0.05              # the real best must beat this share of placebo bests, per objective
  study14_val_min_trades: 30        # frozen: validation 90% week-bootstrap lower bound > 0 on >= this many trades
  study14_neighbour_share: 0.75     # stability: share of eligible grid neighbours positive on discovery
  study14_max_frozen: 4             # family budget
  study15_min_trades: 100           # study 15 (STUDY15.md): ranked combination, discovery trades ...
  study15_min_weeks: 20             # ... on this many weeks
  study15_null_p: 0.05
  study15_val_min_trades: 30
  study15_neighbour_share: 0.75
  study15_max_frozen: 4
  study15_holdout_min_trades: 30
  study16_p: 0.05                   # study 16 (STUDY16.md): placebo p, stage A and the stage B noise test
  study16_tail_share: 0.05          # mean without this share of best weeks must stay > 0
  study16_min_weeks: 52             # stage B: discovery weeks traded to be ranked
  study16_neighbour_share: 0.75
  study16_max_frozen: 4
  study16_holdout_min_weeks: 26
  robustness_min_positive_share: 0.80
  max_variants_before_nq: 20

# Gate 0 (GEX validation) tolerances
validation:
  forward_tol_pts: 5.0     # check 1: S0 within this many points of (ES at quote_time on D-1 - basis) ...
  forward_share: 0.95      # ... on at least this share of days
